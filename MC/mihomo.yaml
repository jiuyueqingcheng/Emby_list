#DNS(2选1，需要注释和反注释，直接删#注意空格)
#Fake IP
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: :23453 #MC如需使用，7874改成23453，再复制粘贴到MC的DNS编辑里
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  respect-rules: false
  prefer-h3: false
  fake-ip-filter:
    - 'rule-set:gfw'
  nameserver:
    - 223.6.6.6
    - 223.5.5.5 
    - 119.29.29.29
