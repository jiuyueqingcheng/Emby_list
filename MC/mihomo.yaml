port: 7890
proxies:

# 机场配置模块
provider_config: &provider_config {"type": "http","interval": 86400,"user-agent": "clash","health-check": {"enable": true,"url": "http://www.apple.com/library/test/success.html","interval": 300}}

proxy-providers:
  # 第一个机场
  AP1:
    url: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXX #修改你的机场1订阅地址
    <<: *provider_config
    override:
      additional-prefix: "[AP1]"
  # 第二个机场
  AP2:
    url: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX #修改你的机场2订阅地址
    <<: *provider_config
    override:
      additional-prefix: "[AP2]"
  # 第三个机场
  AP3:
    url: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX #修改你的机场3订阅地址
    <<: *provider_config
    override:
      additional-prefix: "[AP3]"
      

# 分组配置模块
standard_proxies: &standard_proxies {"type": "select", "proxies": ["🔃 自动选择", "🇺🇸 美国节点", "🇭🇰 香港节点", "🇯🇵 日本节点", "🇨🇳 台湾节点", "🇸🇬 新加坡节点", "🇰🇷 韩国节点", "🌍 其他节点", "DIRECT"], "include-all": true}

# 节点配置模块
filter_proxies: &filter_proxies {"type": "url-test", "url": "http://www.apple.com/library/test/success.html", "interval": 300, "tolerance": 100, "include-all": true}

