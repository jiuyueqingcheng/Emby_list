name: PingMe 签到与 Cookie 获取
description: PingMe 自动签到及 Cookie 获取模块。支持自定义签到时间及脚本响应等待时间。
compat_arguments:
  PingMeCookie: 'true'
  PingMeCron: 30 8,20 * * *
  FetchTimeout: '35'
compat_arguments_schema:
  PingMeCookie:
    name: '[开关] PingMe 获取Cookie'
    description: 成功获取 Cookie 后可以关闭此修改以节省资源
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  PingMeCron:
    name: '[定时] PingMe 签到时间'
    description: 可手动更改 PingMe 脚本运行时间
    default_value: 30 8,20 * * *
  FetchTimeout:
    name: '[设置] 脚本响应超时(秒)'
    description: 所有脚本统一请求超时时间
    default_value: '35'

mitm:
  hostnames:
    - shop-api.retail.mi.com

scripts:
  - name: 小米抽奖 Cookie
    type: http-request
    pattern: ^https:\/\/shop-api\.retail\.mi\.com\/mtop\/navi\/venue\/batch
    requires-body: true
    max-size: 0
    script-path: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js
    img-url: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/mishop.png

  - name: 小米抽奖签到
    type: cron
    cronexp: 30 8 * * *
    timeout: 240
    enable: true
    script-path: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js
    img-url: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/mishop.png