name: 小米抽奖
description: 小米商城 APP 活动任务自动完成与抽奖
author: 能跑就行
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/mishop.png

compat_arguments:
  CAPTURE_ENABLED: false
  CRON_TASK: "20 8,20 * * *"
  CRON_TASK_TIMEOUT: 300

compat_arguments_schema:
  CAPTURE_ENABLED:
    name: "禁用账号抓取"
    description: "开启‘禁用账号抓取‘后抓包脚本不再处理任何请求"
    options:
      - true
      - false
    default_value: false

  CRON_TASK:
    name: "定时任务"
    description: "自定义任务运行时间"
    default_value: "20 8,20 * * *"

  CRON_TASK_TIMEOUT:
    name: "定时任务超时时间"
    description: "自定义定时任务超时时间"
    default_value: 300

scriptings:
  - http_request:
      name: "账号抓取"
      match: ^https:\/\/shop-api\.retail\.mi\.com\/mtop\/navi\/venue\/batch
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js
      timeout: 10
      disabled: {{{CAPTURE_ENABLED}}}

  - schedule:
      name: "定时任务"
      cron: "{{{CRON_TASK}}}"
      script_url: "https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js"
      timeout: {{{CRON_TASK_TIMEOUT}}}

mitm:
  hostnames:
    includes:
      - "shop-api.retail.mi.com"