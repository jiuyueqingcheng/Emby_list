name: 小米抽奖签到
description: |-
  小米商城每日签到、抽奖。
  打开小米商城进入活动页面获取 Cookie，成功后可关闭 Cookie 获取。
compat_arguments:
  Cookie: 'true'
  Task: 'true'
  Cron: 30 8 * * *
compat_arguments_schema:
  Cookie:
    name: 获取 Cookie
    description: 获取小米商城签到 Cookie
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  Task:
    name: 自动签到
    description: 定时执行小米抽奖签到
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  Cron:
    name: 定时参数 Cron
    description: 输入 Cron 表达式修改执行时间
    default_value: 30 8 * * *
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
dns: {}
scriptings:
- http_request:
    name: 获取 Cookie
    match: ^https:\/\/shop-api\.retail\.mi\.com\/mtop\/navi\/venue\/batch
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js
    env:
      _compat.$argument: '{"Cookie":"true"}'
    body_required: true
- schedule:
    name: 小米抽奖签到
    cron: 30 8 * * *
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js
    env:
      _compat.$argument: '{"Task":"true"}'
    timeout: 240
mitm:
  hostnames:
    includes:
    - shop-api.retail.mi.com