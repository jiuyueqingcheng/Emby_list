name: QQ音乐签到
description: QQ音乐自动签到及 Cookie 获取模块，支持自定义签到定时与脚本超时时间。
compat_arguments:
  Cookie: 'true'
  Task: 'true'
  Cron: 30 8 * * *
compat_arguments_schema:
  Cookie:
    name: 获取 Cookie
    description: 获取QQ音乐签到 Cookie
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  Task:
    name: 自动签到
    description: 定时执行QQ音乐签到
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  Cron:
    name: 定时参数 Cron
    description: 输入 Cron 表达式修改执行时间
    default_value: 30 8 * * *
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/qqmusic.png
dns: {}
scriptings:
- http_request:
    name: 获取 Cookie
    match: ^https:\/\/u6\.y\.qq\.com\/cgi-bin\/musics\.fcg\?.*EveryDaySignLvzScore
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
    env:
      _compat.$argument: '{"Cookie":"true"}'
    body_required: true
- schedule:
    name: QQ音乐签到
    cron: 30 8 * * *
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
    env:
      _compat.$argument: '{"Task":"true"}'
    timeout: 240
mitm:
  hostnames:
    includes:
    - shop-api.retail.mi.com