name: QQ音乐 签到与 Cookie 获取
description: QQ音乐自动签到及 Cookie 获取模块，支持自定义签到定时与脚本超时时间。
compat_arguments:
  QQMusicCookie: 'true'
  QQMusicCron: 01 8 * * *
  FetchTimeout: '35'
compat_arguments_schema:
  QQMusicCookie:
    name: '[开关] QQ音乐 获取Cookie'
    description: 成功获取 Cookie 后可以关闭此修改以节省资源
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  QQMusicCron:
    name: '[定时] QQ音乐 签到时间'
    description: 可手动更改 QQ音乐 脚本运行时间
    default_value: 20 9 * * *
  FetchTimeout:
    name: '[设置] 脚本响应超时(秒)'
    description: 设置脚本等待时长，防止网络延迟导致的获取失败
    default_value: '35'
    options:
      - '35'
      - '45'
      - '55'
      - '60'
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/qqmusic.png
dns: {}
scriptings:
  - schedule:
      name: QQ音乐签到
      cron: 01 8 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
      timeout: 60
  - http_request:
      name: QQ音乐获取Cookie
      match: ^https:\/\/u6\.y\.qq\.com\/cgi-bin\/musics\.fcg\?.*EveryDaySignLvzScore
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
      timeout: 60
      body_required: false
mitm:
  hostnames:
    includes:
      - u6.y.qq.com