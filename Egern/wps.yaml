name: WPS 签到与 Cookie 获取
description: WPS 自动签到及 Cookie 获取模块，每日10点执行签到，拦截活动接口抓取账号Cookie
compat_arguments:
  WpsCookie: 'true'
  WpsCron: 4 8 * * *
  FetchTimeout: '35'
compat_arguments_schema:
  WpsCookie:
    name: '[开关] WPS 获取Cookie'
    description: 成功获取 Cookie 后可关闭减少劫持开销
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  WpsCron:
    name: '[定时] WPS 签到执行时间'
    description: 自定义签到定时cron表达式
    default_value: 4 8 * * *
  FetchTimeout:
    name: '[设置] 脚本响应超时(秒)'
    description: 网络延迟时延长超时避免执行失败
    default_value: '35'
    options:
    - '35'
    - '45'
    - '55'
    - '60'
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/wps.png
dns: {}
scriptings:
- schedule:
    name: WPS签到
    cron: 4 8 * * *
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.js
    timeout: 60
- http_request:
    name: WPS获取Cookie
    match: ^https:\/\/personal-act\.wps\.cn\/activity-rubik\/activity\/page_info
    script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.cookie.js
    timeout: 60
    body_required: false
mitm:
  hostnames:
    includes:
    - personal-act.wps.cn