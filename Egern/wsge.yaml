name: 网上国网 签到与Cookie获取
description: 网上国网自动签到及Cookie抓取模块，支持自定义签到定时、抓包开关、脚本超时时间
compat_arguments:
  SgccCookie: 'true'
  SgccCron: 30 8 * * *
  FetchTimeout: '35'
compat_arguments_schema:
  SgccCookie:
    name: '[开关] 网上国网自动获取Cookie'
    description: 成功缓存Cookie后可关闭以减少MITM劫持资源占用
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  SgccCron:
    name: '[定时] 网上国网签到执行时间'
    description: 自定义签到定时Cron表达式，按需修改执行时段
    default_value: 30 8 * * *
  FetchTimeout:
    name: '[设置] 脚本请求超时(秒)'
    description: 网络波动时延长超时避免签到/抓Cookie失败
    default_value: '35'
    options:
      - '35'
      - '45'
      - '55'
      - '60'
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/sgcc.png
dns: {}
scriptings:
  # 定时签到任务
  - schedule:
      name: 网上国网签到
      cron: 30 8 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/sgcc/sgcc.js
      timeout: 60
  # MITM抓Cookie拦截脚本
  - http_request:
      name: 网上国网获取Cookie
      match: ^https?:\/\/csc-service\.sgcc\.com\.cn:28630\/.+\/member\/
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/sgcc/sgcc.cookie.js
      timeout: 60
      body_required: true
mitm:
  hostnames:
    includes:
      - csc-service.sgcc.com.cn