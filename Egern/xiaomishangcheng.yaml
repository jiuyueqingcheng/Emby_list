name: 小米商城 签到与 Cookie 获取
description: 小米商城自动签到及 Cookie 获取模块，支持自定义签到定时与脚本超时时间。
compat_arguments:
  MiShopCookie: 'true'
  MiShopCron: 03 8 * * *
  FetchTimeout: '35'
compat_arguments_schema:
  MiShopCookie:
    name: '[开关] 小米商城 获取Cookie'
    description: 成功获取 Cookie 后可关闭此功能节省资源
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  MiShopCron:
    name: '[定时] 小米商城 签到时间'
    description: 自定义签到脚本运行Cron表达式
    default_value: 03 8 * * *
  FetchTimeout:
    name: '[设置] 脚本响应超时(秒)'
    description: 网络延迟时延长等待，避免签到/抓Cookie失败
    default_value: '35'
    options:
      - '35'
      - '45'
      - '55'
      - '60'
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/mishop.png
dns: {}
scriptings:
  - schedule:
      name: 小米商城签到
      cron: 03 8 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/mishop/mishop.js
      timeout: 60
  - http_request:
      name: 小米商城获取Cookie
      match: ^https:\/\/shop-api\.retail\.mi\.com\/mtop\/mf\/act\/infinite\/(do|done)
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/mishop/mishop.cookie.js
      timeout: 60
      body_required: false
mitm:
  hostnames:
    includes:
      - shop-api.retail.mi.com